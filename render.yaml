# ---------------------------------------------------------------------------
# Démonstration de la boutique sur Render.
#
# Un seul service, qui embarque Apache, PHP et MariaDB : Render ne propose pas
# de base MySQL managée, et réécrire toutes les requêtes pour PostgreSQL
# coûterait plus cher que la démonstration ne vaut.
#
# À ne pas confondre avec une mise en production : les données repartent de
# zéro à chaque réveil du service. Pour ouvrir la boutique pour de vrai, voir
# « Mettre en ligne chez OVH » dans le README.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: bouge-club-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /

    envVars:
      # Compte d'administration, recréé à chaque démarrage. Le mot de passe est
      # tiré au sort par Render et jamais écrit dans le dépôt ; il se lit dans
      # l'onglet « Environment » du service.
      - key: BOUGE_ADMIN_EMAIL
        value: demo@bouge.fr
      - key: BOUGE_ADMIN_PASSWORD
        generateValue: true

      # Points relais inventés : de quoi montrer le tunnel de commande en
      # entier sans compte transporteur. Jamais sur une vraie boutique.
      - key: BOUGE_CARRIER_DRIVER
        value: demonstration

      # Laissées vides : le paiement s'arrête alors sur un message explicite
      # plutôt que sur une erreur. Renseignez les clés de TEST de Stripe pour
      # dérouler un paiement de bout en bout.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Transporteur. Vides, le pilote « demonstration » ci-dessus continue
      # d'inventer les points relais. Renseignées avec un compte de TEST
      # Boxtal, passez BOUGE_CARRIER_DRIVER à « boxtal » pour dérouler
      # l'achat d'étiquette sans rien payer.
      - key: BOXTAL_USER
        sync: false
      - key: BOXTAL_PASSWORD
        sync: false
      - key: BOXTAL_TEST
        value: "1"

      # Courriels. Sans BOUGE_MAIL_FROM, la démonstration n'écrit à personne :
      # c'est ce qu'on veut d'une démonstration. Les renseigner suffit à
      # activer l'accusé de commande et le lien de mot de passe oublié.
      - key: BOUGE_MAIL_FROM
        sync: false
      - key: BOUGE_SMTP_HOST
        sync: false
      - key: BOUGE_SMTP_USER
        sync: false
      - key: BOUGE_SMTP_PASSWORD
        sync: false
