# Le domaine sert le dossier public/ et rien d'autre : la configuration, le
# code, les gabarits et le schéma restent hors de portée du web.
<VirtualHost *:*>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # AllowOverride All : le .htaccess du dossier public porte le
        # contrôleur frontal, et celui de public/uploads interdit l'exécution
        # de code. Les désactiver ici les rendrait muets.
        AllowOverride All
        Require all granted
    </Directory>

    # Render termine le TLS devant le conteneur et transmet le protocole
    # d'origine ; sans cela PHP croirait toutes les visites en clair.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
